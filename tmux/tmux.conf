# ~/.tmux.conf — minimal, informational, pleasant.
#
# Prefix is C-Space (default C-b is a reach and collides with vimrc's <C-b>
# = :Buffers when vim runs inside tmux). C-Space costs no readline chord,
# no vim binding, and is a thumb+pinky press instead of an awkward stretch.
#
# In iTerm2 tmux-CC mode (`tmux -CC new -As work`) the status bar is hidden
# and iTerm2 renders windows/panes natively; the styling below mostly earns
# its keep in plain tmux mode — i.e. when you're ssh'd into a cell host.
#
# Heads-up if C-Space ever "does nothing": macOS Sonoma+ ships with
# ⌃ Space bound to "Select next input source" (System Settings → Keyboard →
# Keyboard Shortcuts → Input Sources) — disable it there so iTerm2 sees the key.

# ---- PREFIX ------------------------------------------------------------------

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix    # nested tmux: C-Space C-Space reaches the inner

# ---- SANE DEFAULTS -----------------------------------------------------------

set -g default-terminal "tmux-256color"             # inside-pane TERM (rich caps)
# Outer-terminal capability injection. iTerm2 speaks truecolor + supports a
# real default background, but macOS's stock xterm-256color terminfo doesn't
# advertise either. Without these two `terminal-overrides` flags tmux paints
# a grey slab across the status bar (bg=default falls back to "some bg") and
# colours quantise to 256. `terminal-overrides` is used instead of the newer
# `terminal-features` because the latter's append behaviour was flaky here.
set -ag terminal-overrides ",xterm*:RGB:AX"
set -sg escape-time 10                              # kill the 500ms esc delay (vim)
set -g history-limit 50000                          # long scrollback
set -g mouse on                                     # scroll, select, resize
set -g focus-events on                              # so vim's FocusGained etc. fire
set -g renumber-windows on                          # no gaps after closing a window
set -g base-index 1                                 # windows/panes count from 1,
setw -g pane-base-index 1                           # matching the 1-9 keyboard row
set -g set-clipboard on                             # OSC 52 -> terminal clipboard
setw -g mode-keys vi                                # vi keys in copy mode
set -g wrap-search off                              # search doesn't wrap around
set -g copy-mode-match-style 'bg=yellow,fg=black'          # all matches lit up
set -g copy-mode-current-match-style 'bg=orange,fg=black'  # current match brighter

# ---- KEYBINDS (small, high-value additions) ----------------------------------

bind r source-file ~/.tmux.conf \; display "reloaded"       # prefix r -> reload
bind s display-popup -E -w 90% -h 85% "~/.local/bin/tmux-session-picker switch"
bind | split-window -h -c "#{pane_current_path}"            # prefix | -> vsplit
bind - split-window -v -c "#{pane_current_path}"            # prefix - -> hsplit
unbind '"'
unbind %

# Copy mode: mimic vim — v selects, y yanks to system clipboard (via OSC 52).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# / searches backward (up, toward older output) incrementally — like vim incsearch.
# ? searches forward (down) incrementally.
bind -T copy-mode-vi / command-prompt -i -p "(search up)" "send-keys -X search-backward-incremental '%%%'"
bind -T copy-mode-vi ? command-prompt -i -p "(search down)" "send-keys -X search-forward-incremental '%%%'"

# ---- SESSION PERSISTENCE (tmux-resurrect) ------------------------------------
# Saves/restores session layout, windows, panes, working dirs.
# C-Space C-s   save (do this before shutdown)
# C-Space C-r   restore after reboot

run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# ---- STATUS BAR — always on; it's the "am I in tmux?" signal ---------------
# Text-only design. No pill chips — everything sits directly on the terminal
# background (bg=default, which truly renders transparent thanks to the AX
# cap injected above). Colour comes from foreground only, so the bar blends
# into whatever pane bg you're on — the tmux row visually disappears,
# leaving only its text overlaid on the pane behind it.
#
# The one bit of chrome: the session name changes colour when the prefix is
# active (blue -> yellow/amber) — "is tmux listening for my next keystroke?"
#
# Uses terminal-inherited ANSI colour names (blue, green, white,
# brightblack) instead of hex — respects whatever iTerm2 theme you're on,
# same approach as starship.toml.


set -g status 2
set -g status-format[1] ""    # blank padding line between bar and pane content
bind b set-option status                                    # prefix + b -> toggle bar
set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre                       # windows in the middle
set -g status-style "fg=brightblack,bg=default"

# Left: session name. Blue normally, yellow when prefix is active.
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,yellow,blue},bold]  #S   "

# Right: dim clock + hostname
set -g status-right-length 60
set -g status-right "#[fg=brightblack]saved: #(date -r $HOME/.local/share/tmux/resurrect/last +%%H:%%M 2>/dev/null || echo none)   %H:%M   #[fg=white,bold]#h  "

# Windows: current is bold yellow, inactive are muted. No pills, just text.
set -g window-status-format " #[fg=brightblack]#I·#W "
set -g window-status-current-format " #[fg=yellow,bold]#I·#W#{?window_zoomed_flag, ⤢,} "
set -g window-status-separator ""

# Pane borders — barely-there dim; active pane gets the blue accent.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

# Command / message bar — accent fg, transparent bg
set -g message-style "fg=yellow,bg=default"
set -g message-command-style "fg=blue,bg=default"

